# Bail application under s.497 (after arrest) or s.498 (before arrest) of the Code of Criminal
# Procedure, 1898. Bump `version` whenever a field or section changes (ai.v1 DraftTemplate).
id: bail_application
version: "1"
title: Bail application (s.497/498 CrPC)
description: >-
  An application for bail after arrest under s.497 CrPC, or for pre-arrest bail under s.498 CrPC,
  in a non-bailable offence. Sets out the FIR, the facts, the grounds and the prayer.
fields:
  - key: court
    label: Court
    required: true
    caseField: court
  - key: case_number
    label: Bail application number
    required: false
    caseField: caseNumber
  - key: parties
    label: Parties (one per line)
    required: true
    caseField: parties
  - key: bail_type
    label: Bail sought (post-arrest under s.497 or pre-arrest under s.498)
    required: true
    caseField: null
  - key: fir_number
    label: FIR number and date
    required: true
    caseField: null
  - key: police_station
    label: Police station
    required: true
    caseField: null
  - key: offences
    label: Offences charged (sections, one per line)
    required: true
    caseField: relevantLaws
  - key: arrest_date
    label: Date of arrest (post-arrest bail only)
    required: false
    caseField: null
  - key: earlier_applications
    label: Earlier bail applications and their outcome
    required: false
    caseField: null
  - key: counsel
    label: Counsel for the applicant
    required: false
    caseField: assignedLawyer
sections:
  - key: cause_title
    heading: Cause title
    required: true
    assistable: false
    guidance: >-
      The court, the application number, the applicant (accused) against the State, the FIR
      number and date, the police station and the offences charged.
  - key: facts
    heading: Brief facts
    required: true
    assistable: true
    guidance: >-
      The prosecution case as stated in the FIR, in a few short paragraphs: the date, place and
      alleged role of the applicant. State the facts; do not argue them here.
  - key: grounds
    heading: Grounds for bail
    required: true
    assistable: true
    guidance: >-
      Numbered grounds. After arrest (s.497): whether the offence falls within the prohibitory
      clause of s.497(1), reasonable grounds for further inquiry under s.497(2), delay in the FIR,
      the evidence and recoveries, the period in custody, and any statutory delay in trial. Before
      arrest (s.498): mala fide or an ulterior motive for the arrest and the risk of humiliation,
      as well as merit. Cite the provision or judgment that supports each ground.
  - key: earlier_applications
    heading: Earlier applications
    required: true
    assistable: false
    guidance: >-
      State whether any bail application on the same facts was made before this or any other
      court, and its outcome. If none, say that no such application has been filed or is pending.
  - key: undertaking
    heading: Undertaking
    required: false
    assistable: false
    guidance: >-
      That the applicant will furnish surety to the satisfaction of the court, attend every
      hearing and not tamper with the prosecution evidence.
  - key: prayer
    heading: Prayer
    required: true
    assistable: true
    guidance: >-
      The relief sought: release on bail after arrest under s.497 CrPC, or confirmation of
      ad-interim pre-arrest bail under s.498 CrPC, on such surety as the court thinks fit.
  - key: affidavit
    heading: Affidavit
    required: true
    assistable: false
    guidance: >-
      The supporting affidavit of the applicant or the deponent on their behalf, stating that the
      contents are true and correct to the best of their knowledge and belief.
