# Alembic for the schemas services/ai owns: corpus and ai (ADR-0002, PRD §14.2).
# The database URL comes from AI_DATABASE_URL (env, then services/ai/.env, then the repo .env),
# never from this file. Run as caseguard_ai:  uv run alembic upgrade head   (or pnpm db:migrate:ai)
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
