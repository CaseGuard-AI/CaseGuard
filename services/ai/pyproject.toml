[project]
name = "caseguard-ai"
version = "0.1.0"
description = "CaseGuard AI service: retrieval, trust layer, graph, temporal, model gateway (internal /ai/v1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "sqlalchemy>=2.0.36",
  "pgvector>=0.3.6",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseguard_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["caseguard_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
