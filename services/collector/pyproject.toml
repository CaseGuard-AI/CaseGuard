[project]
name = "caseguard-collector"
version = "0.1.0"
description = "Provenance-tracked ingestion of Pakistani legal documents (PRD §15)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.27.2",
  "beautifulsoup4==4.12.3",
  "lxml>=5.3.0",
  "python-dotenv==1.2.2",
  "PyMuPDF>=1.25.1",
  "pdfplumber==0.11.4",
  "SQLAlchemy>=2.0.35",
  "psycopg[binary]>=3.2.3",
]

[project.optional-dependencies]
# OCR for scanned judgments. Also needs the tesseract binary (see README).
ocr = ["pytesseract==0.3.13", "Pillow>=10.4.0"]

[dependency-groups]
dev = ["pytest>=8.3.3", "pytest-cov>=5.0.0", "ruff>=0.7", "mypy>=1.13"]

[tool.uv]
# Flat script layout (main.py + top-level packages): install deps only, not the project.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "data_demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # UP042: (str, Enum) is intentional; StrEnum changes str()

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["data/", "data_demo/", "tests/"]
