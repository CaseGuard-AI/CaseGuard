version: 2
# All update PRs target `staging`, never `main`. Titles are Conventional Commits
# (`build(deps): …`, `ci(deps): …`) so they pass the PR policy check.
# Minor and patch updates are auto-merged once CI is green; majors wait for review
# (.github/workflows/dependabot-automerge.yml).
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci", include: scope }
    groups:
      actions-minor-and-patch: { patterns: ["*"], update-types: ["minor", "patch"] }

  # pnpm workspace: apps/web, apps/api (one lockfile at the root).
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build", include: scope }
    open-pull-requests-limit: 10
    groups:
      js-minor-and-patch: { update-types: ["minor", "patch"] }

  - package-ecosystem: uv
    directories: ["/services/ai", "/services/collector"]
    target-branch: staging
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build", include: scope }
    groups:
      py-minor-and-patch: { update-types: ["minor", "patch"] }

  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web", "/services/ai"]
    target-branch: staging
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build", include: scope }

  - package-ecosystem: docker-compose
    directory: /
    target-branch: staging
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build", include: scope }
