version: 2
# All update PRs target `staging`, never `main`.
# Uncomment the npm / uv entries once apps/web, apps/api and services/* are scaffolded.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker-compose
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(infra)" }

