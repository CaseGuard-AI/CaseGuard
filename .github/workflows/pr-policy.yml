name: PR policy

# Enforces the branching model (docs/engineering/branching-and-release.md):
#  - PR titles are Conventional Commits (they become the squash commit on staging)
#  - branch names follow <prefix>/<area>-<desc>
#  - only staging, release/* and hotfix/* may target main

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            ci
            build
            revert
            release
          scopes: |
            web
            api
            ai
            collector
            contracts
            infra
            docs
            eval
            prd
            deps
          requireScope: false

  branch:
    name: Branch naming and target
    runs-on: ubuntu-latest
    steps:
      - name: Check head and base branches
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "head=$HEAD base=$BASE"
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              staging|release/*|hotfix/*) echo "OK: allowed source for main";;
              *) echo "::error::Only staging, release/* or hotfix/* may target main. Retarget this PR to staging."; exit 1;;
            esac
            exit 0
          fi
          if [ "$BASE" = "staging" ]; then
            if [ "$HEAD" = "main" ]; then echo "OK: main → staging sync"; exit 0; fi
            if echo "$HEAD" | grep -Eq '^(feature|fix|chore|docs|refactor|test|perf|ci|build|revert|dependabot)/[a-z0-9._/-]+$'; then
              echo "OK: branch name follows convention"
            else
              echo "::error::Branch '$HEAD' must be <prefix>/<area>-<desc> (prefix: feature|fix|chore|docs|refactor|test). See CONTRIBUTING.md."
              exit 1
            fi
          fi
