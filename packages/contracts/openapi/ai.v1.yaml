openapi: 3.1.0
info:
  title: CaseGuard AI service (internal)
  version: 1.0.0-draft
  summary: Internal API between apps/api (caller) and services/ai (producer).
  description: |
    Internal only (ADR-0002, SEC-14). Never exposed to browsers. Every request carries
    `Authorization: Bearer <AI_SERVICE_TOKEN>`.

    services/ai has **no user authentication**. Express resolves the access decision and
    passes the resulting `scope`, which services/ai applies **inside SQL** (FR-CASE-6).

    Status values come from the single trust store (FR-TRUST-10). This API returns them;
    callers never recompute them.
  license:
    name: Proprietary (FYP)
    identifier: LicenseRef-CaseGuard-FYP
servers:
  - url: http://ai:8000
    description: Compose internal network
  - url: http://localhost:8000
    description: Local development
security:
  - serviceToken: []
tags:
  - name: ops
    description: Liveness and smoke tests
  - name: research
    description: Question answering with verified citations (FR-RES, FR-TRUST)
  - name: sources
    description: Corpus records and stored verification results
  - name: ingestion
    description: |
      Processing a user's uploaded document into case chunks (FR-DOC-2, FR-DOC-6, ADR-0010).
      apps/api submits and polls; services/ai never calls apps/api.

paths:
  /ai/v1/info:
    get:
      tags: [ops]
      operationId: getInfo
      summary: Authenticated smoke test
      responses:
        "200":
          description: Service identity
          content:
            application/json:
              schema:
                type: object
                required: [service, version]
                properties:
                  service: { type: string, example: caseguard-ai }
                  version: { type: string, example: 0.1.0 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ai/v1/research/answer:
    post:
      tags: [research]
      operationId: answerQuestion
      summary: Answer a legal question within a resolved scope
      description: |
        Runs retrieval → graph step → rerank → generation → trust layer. Returns only when every
        citation has a stored verification (FR-RES-6). If the corpus doesn't support an answer,
        `answerable` is false and `citations` is empty (FR-RES-9).

        Every model call for this request goes only to providers in `allowedProviders` (SEC-11).
        If no allowed provider is configured for a role the pipeline needs, the answer is 503,
        never a fallback to another provider.

        With `credential` (a user's own key, FR-SET-2, ADR-0009), the generation role uses that
        provider, model and key for this request only. A `credential` whose `providerId` is not in
        `allowedProviders`, or is not a known cloud provider, is rejected with 400 before any
        model call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
      responses:
        "200":
          description: Answer with verified citations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Answer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /ai/v1/citations/{citationId}:
    get:
      tags: [sources]
      operationId: getCitation
      summary: A citation with its current stored verification
      parameters:
        - $ref: "#/components/parameters/CitationId"
      responses:
        "200":
          description: Citation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Citation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/v1/sources/{sourceId}:
    get:
      tags: [sources]
      operationId: getSource
      summary: A corpus source record (FR-RES-7)
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/v1/documents/{documentId}/ingestion:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [ingestion]
      operationId: startIngestion
      summary: Start processing an uploaded document (FR-DOC-2, ADR-0010)
      description: |
        Called by apps/api's document job, never by a browser. Answers 202 at once with the
        ingestion's status; the work runs in services/ai's own workers, off the request path
        (SEC-6). services/ai reads the file read-only from the blob store by `storageKey` and
        writes chunks and embeddings to `ai.case_chunks` with the request's `scope.userId` and
        `caseId` (FR-DOC-6). It never writes the `app` schema and never calls apps/api.

        **Idempotent per `(documentId, attempt)`:**
        - the same attempt again (running or finished) changes nothing and returns its status;
        - a higher attempt supersedes the current one: a running attempt is stopped and its
          partial output dropped. The document's existing chunks stay retrievable until the new
          attempt's `index` stage replaces them in one transaction;
        - a lower attempt than the current one is a 409.

        400 if `storageKey` is not exactly `users/{scope.userId}/cases/{caseId}/{documentId}`,
        or `scope.allowedCaseIds` is not `[caseId]`, or `mediaType` is not supported.

        Ingestion sends no document data to a remote model provider in P1: OCR runs locally and
        embeddings in-process (ADR-0008).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestionRequest" }
      responses:
        "202":
          description: Accepted. The status of this attempt, usually `queued`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [ingestion]
      operationId: getIngestion
      summary: The current attempt's status, for polling (FR-DOC-3, NFR-13)
      description: |
        apps/api polls this after `startIngestion` (ADR-0010):
        - **Backoff.** Every 2 s at first, doubling to at most 30 s. If the attempt has not
          finished after 30 minutes, apps/api treats it as `failed` and `retryable`.
        - **Status mapping** to api.v1 `DocumentStatus`: `queued` → `queued`, `running` →
          `processing`, `done` → `done`, `flagged` → `flagged`, `failed` → `failed`.
        - **Retries (NFR-13).** On `failed` with `retryable: true`, apps/api submits
          `attempt + 1` with a delay, up to 3 attempts in all (a deployment setting); the
          document shows `processing` meanwhile. When attempts run out, or `retryable` is
          false, the document is `failed` with `error` and stays listed for the user to retry.
          It is never dropped.
        - **Stage log (FR-DOC-2).** apps/api stores `stages` with the document, so each stage's
          outcome is logged per attempt.

        State is persisted by services/ai, so it survives a restart. An attempt interrupted by a
        restart is reported `failed` with `retryable: true`. 404 if nothing was ever submitted
        for the document (apps/api then submits again) or it has been purged.
      responses:
        "200":
          description: Ingestion status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/v1/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    delete:
      tags: [ingestion]
      operationId: purgeDocument
      summary: Remove everything services/ai holds for a document
      description: |
        Stops a running ingestion and deletes the document's chunks, embeddings and ingestion
        records, so it can never be retrieved again. Idempotent: an unknown or already purged
        document is also a 204. Called by apps/api's retryable purge job (data-storage §6),
        which deletes the blob itself afterwards; services/ai has read-only access to blobs.
      responses:
        "204": { description: Purged }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Shared AI_SERVICE_TOKEN; only apps/api holds it.

  parameters:
    CitationId:
      name: citationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: The document's id in apps/api (`app.documents`).
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid service token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with the resource's current state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: A dependency (database or model provider) is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      description: RFC 9457 problem details
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Scope:
      description: Access scope resolved by apps/api. Applied inside SQL; never widened (FR-CASE-6).
      type: object
      required: [userId, accountId, allowedCaseIds]
      properties:
        userId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        allowedCaseIds:
          description: Cases whose private documents may be retrieved. Empty = public corpus only.
          type: array
          items: { type: string, format: uuid }

    Language:
      type: string
      enum: [en, ur, roman_ur]

    ProviderId:
      description: |
        Stable model-provider key, such as `gemini` or `ollama` (ADR-0005). Shared with api.v1,
        where the Admin's allow-list uses the same keys.
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      examples: [gemini, ollama]

    Turn:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }

    AnswerRequest:
      type: object
      required: [requestId, question, scope]
      properties:
        requestId:
          description: Correlation ID from apps/api; also the audit record key (FR-TRUST-12).
          type: string
          format: uuid
        question: { type: string, minLength: 1, maxLength: 4000 }
        language:
          description: Omit to auto-detect (§8.3).
          allOf: [{ $ref: "#/components/schemas/Language" }]
        lawAsOf:
          description: Answer "law as of date D" for curated sections (FR-RES-11, FR-TEMP-5).
          type: string
          format: date
        history:
          description: Earlier turns of the conversation, oldest first (FR-RES-8).
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Turn" }
        scope: { $ref: "#/components/schemas/Scope" }
        allowedProviders:
          description: |
            Model providers this request's data may be sent to: the Admin's allow-list, resolved
            by apps/api (FR-AUTH-3, SEC-11). services/ai never widens it. Omitted means local
            providers only (for example Ollama), so a caller that forgets it fails closed.
          type: array
          uniqueItems: true
          maxItems: 32
          items: { $ref: "#/components/schemas/ProviderId" }
        credential:
          description: |
            Optional. The user's own key and chosen model (FR-SET-2, ADR-0009), decrypted by
            apps/api for this request. Omitted means unchanged behaviour: env-configured providers
            only.
          allOf: [{ $ref: "#/components/schemas/Credential" }]

    Credential:
      description: |
        A user-supplied model credential for one request (FR-SET-2, SEC-4, SEC-11, ADR-0009).

        - Rejected with 400 unless `providerId` is in `allowedProviders` **and** is a known cloud
          provider (a preset in `gateway/providers.py`; local providers such as `ollama` are
          keyless and never take a credential).
        - Overrides the **generation** role only, for this request only. Other roles keep the
          deployment's configuration.
        - `apiKey` is never logged, stored, put in the answer trace or returned. services/ai
          keeps no copy after the request.
      type: object
      required: [providerId, model, apiKey]
      additionalProperties: false
      properties:
        providerId: { $ref: "#/components/schemas/ProviderId" }
        model:
          description: The provider's model id, for example `gemini-2.0-flash`.
          type: string
          minLength: 1
          maxLength: 200
        apiKey:
          description: The plaintext provider key. Secret; never logged or stored.
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true

    Answer:
      type: object
      required: [requestId, answerable, language, text, citations]
      properties:
        requestId: { type: string, format: uuid }
        answerable:
          description: False when the corpus doesn't support an answer (FR-RES-9).
          type: boolean
        language: { $ref: "#/components/schemas/Language" }
        text:
          description: |
            Answer text in the user's language. Citation markers appear as `[[c:<citationId>]]`
            at the claim they support.
          type: string
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        asOfNote:
          description: |
            Present only when the request gave `lawAsOf` (FR-RES-11): in the answer's language,
            says that judgments decided after that date were excluded and that statute text is
            the current version, because historical versions are not curated yet.
          type: string

    Citation:
      type: object
      required: [id, sourceId, claim, verification]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        claim:
          description: The claim in the answer that this citation supports.
          type: string
        locator:
          description: Section, article or paragraph within the source.
          type: string
          examples: ["s. 497", "para 14"]
        quote:
          description: Verbatim span in the source's original language (FR-RES-10).
          type: string
        quoteLanguage: { $ref: "#/components/schemas/Language" }
        verification: { $ref: "#/components/schemas/Verification" }

    Verification:
      description: Stored trust-layer result (§7). Exactly one status per citation (FR-TRUST-4).
      type: object
      required: [status, flags, lastVerifiedAt]
      properties:
        status:
          type: string
          enum: [verified, needs_review, unverified]
        flags:
          type: array
          items:
            type: string
            enum:
              # blocking (force needs_review)
              - overruled
              - repealed
              - superseded_version
              - conflict
              # non-blocking (shown as chips)
              - stale
              - third_party_source
              - headnote_only
              - amended_since
        lastVerifiedAt: { type: string, format: date-time }
        checks:
          type: object
          properties:
            existence: { type: string, enum: [pass, fail] }
            support: { type: string, enum: [pass, uncertain, fail, not_run] }
            currency: { type: string, enum: [current, historical, unknown] }
            support_method:
              description: >-
                How the support verdict was reached: "nli", or "nli+llm" when the NLI model was
                uncertain and the judge decided (FR-TRUST-3). Only present when support ran.
              type: string
            support_score:
              description: P(entailment) from the NLI model, 0 to 1. Only present when support ran.
              type: number
              minimum: 0
              maximum: 1

    Source:
      type: object
      required: [id, kind, title, officialUrl, language]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [statute, judgment, rule, other] }
        title: { type: string }
        citation:
          description: Reported citation, e.g. "PLD 2023 SC 1".
          type: string
        court: { type: string }
        decidedOn: { type: string, format: date }
        officialUrl:
          description: Public URL of the original on the official source (FR-RES-7).
          type: string
          format: uri
        sourceTier:
          description: Source register tier (§15.2).
          type: integer
          enum: [1, 2]
        thirdParty: { type: boolean }
        headnoteOnly: { type: boolean }
        language: { $ref: "#/components/schemas/Language" }
        excerpt:
          description: Text around the cited locator, verbatim.
          type: string
        retrievedAt: { type: string, format: date-time }

    DocumentMediaType:
      description: |
        The file types a user can upload (FR-DOC-1): PDF, DOCX, and scanned pages as PNG, JPEG
        or TIFF. Shared with api.v1, which accepts exactly these, so services/ai can process every
        file the API stores. apps/api finds the type by sniffing the content, never from the
        client's header or the file extension.
      type: string
      enum:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - image/png
        - image/jpeg
        - image/tiff

    DocumentStage:
      description: |
        The processing stages of FR-DOC-2, in order. `ocr` runs only where a page has no text
        layer (scans and images); English only in P1.
      type: string
      enum: [ocr, extract, clean, structure, chunk, embed, index]

    DocumentFlag:
      description: |
        Something uncertain found while processing (FR-DOC-4). A flagged document is retrievable,
        but the flagged part is never shown as clean. Shared with api.v1.
      type: object
      required: [stage, code, message, page]
      properties:
        stage: { $ref: "#/components/schemas/DocumentStage" }
        code:
          description: |
            Machine-readable reason, snake_case. Known codes: `low_ocr_confidence`,
            `unreadable_page`, `no_text`, `not_english`, `table_not_extracted`,
            `encrypted_file`, `truncated`. New codes can be added without a contract change, so a
            consumer shows `message` for a code it doesn't know.
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          examples: [low_ocr_confidence]
        message:
          description: For the user, in English. Says what is uncertain, not how to fix the pipeline.
          type: string
          maxLength: 500
          examples: ["Page 3 was hard to read; check the text against the original."]
        page:
          description: 1-based page number, or null when the flag is about the whole document.
          type: [integer, "null"]
          minimum: 1

    IngestionRequest:
      type: object
      required: [scope, caseId, storageKey, mediaType, filename, attempt]
      additionalProperties: false
      properties:
        scope:
          description: |
            The document owner's scope, resolved by apps/api. `allowedCaseIds` is exactly
            `[caseId]`; chunks are written with `scope.userId` and `caseId` (FR-DOC-6).
          allOf: [{ $ref: "#/components/schemas/Scope" }]
        caseId: { type: string, format: uuid }
        storageKey:
          description: |
            Blob key of the original file (data-storage §6). Must be exactly
            `users/{scope.userId}/cases/{caseId}/{documentId}`, else 400. Read-only.
          type: string
          pattern: "^users/[0-9a-f-]{36}/cases/[0-9a-f-]{36}/[0-9a-f-]{36}$"
        mediaType: { $ref: "#/components/schemas/DocumentMediaType" }
        filename:
          description: The original filename, for logs and locators only. Never used as a path.
          type: string
          minLength: 1
          maxLength: 255
        attempt:
          description: 1 for the first run; apps/api increases it for each retry (NFR-13).
          type: integer
          minimum: 1

    IngestionState:
      description: |
        `flagged`: finished and retrievable, with at least one `DocumentFlag`. `failed`: nothing
        from this attempt is retrievable; see `error` and `retryable`.
      type: string
      enum: [queued, running, done, flagged, failed]

    IngestionStage:
      description: One stage's outcome in an attempt (FR-DOC-2 "each stage outcome is logged").
      type: object
      required: [stage, state, startedAt, finishedAt, flags]
      properties:
        stage: { $ref: "#/components/schemas/DocumentStage" }
        state:
          description: "`skipped` when the stage isn't needed, such as `ocr` for a page with a text layer."
          type: string
          enum: [pending, running, done, flagged, failed, skipped]
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        flags:
          type: array
          items: { $ref: "#/components/schemas/DocumentFlag" }

    IngestionStatus:
      type: object
      required: [documentId, attempt, state, stages, flags, error, retryable, pages, chunkCount]
      properties:
        documentId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/IngestionState" }
        stages:
          description: Every stage of `DocumentStage`, in order.
          type: array
          items: { $ref: "#/components/schemas/IngestionStage" }
        flags:
          description: All flags of the attempt, from every stage.
          type: array
          items: { $ref: "#/components/schemas/DocumentFlag" }
        error:
          description: Set only when `state` is `failed`. For the user, in English; no stack traces or paths.
          type: [string, "null"]
          maxLength: 500
        retryable:
          description: |
            When `failed`: whether another attempt may succeed (a timeout, a restart, a dependency
            down) or not (a corrupt or encrypted file). False in every other state.
          type: boolean
        pages: { type: [integer, "null"], minimum: 0 }
        chunkCount:
          description: Chunks indexed, once `done` or `flagged`; null before.
          type: [integer, "null"]
          minimum: 0
