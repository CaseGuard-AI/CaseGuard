openapi: 3.1.0
info:
  title: CaseGuard AI service (internal)
  version: 1.0.0-draft
  summary: Internal API between apps/api (caller) and services/ai (producer).
  description: |
    Internal only (ADR-0002, SEC-14). Never exposed to browsers. Every request carries
    `Authorization: Bearer <AI_SERVICE_TOKEN>`.

    services/ai has **no user authentication**. Express resolves the access decision and
    passes the resulting `scope`, which services/ai applies **inside SQL** (FR-CASE-6).

    Status values come from the single trust store (FR-TRUST-10). This API returns them;
    callers never recompute them.
  license:
    name: Proprietary (FYP)
    identifier: LicenseRef-CaseGuard-FYP
servers:
  - url: http://ai:8000
    description: Compose internal network
  - url: http://localhost:8000
    description: Local development
security:
  - serviceToken: []
tags:
  - name: ops
    description: Liveness and smoke tests
  - name: research
    description: Question answering with verified citations (FR-RES, FR-TRUST)
  - name: sources
    description: Corpus records and stored verification results
  - name: ingestion
    description: |
      Processing a user's uploaded document into case chunks (FR-DOC-2, FR-DOC-6, ADR-0010).
      apps/api submits and polls; services/ai never calls apps/api.
  - name: precedents
    description: |
      Judgment search over the public corpus, expanded through the knowledge graph (FR-PREC,
      FR-GRAPH-1, ADR-0011). Deterministic: no model provider is called.
  - name: drafting
    description: |
      Templates and AI-assisted section drafting (FR-DRAFT). Every citation inserted goes through
      the trust layer and is stored in the single trust store (FR-DRAFT-3, FR-TRUST-10).
  - name: linter
    description: |
      Procedural linting of a bail application or plaint against a rule set (FR-LINT,
      ADR-0012). Deterministic and read-only: the text is never modified (FR-LINT-3).

paths:
  /ai/v1/info:
    get:
      tags: [ops]
      operationId: getInfo
      summary: Authenticated smoke test
      responses:
        "200":
          description: Service identity
          content:
            application/json:
              schema:
                type: object
                required: [service, version]
                properties:
                  service: { type: string, example: caseguard-ai }
                  version: { type: string, example: 0.1.0 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ai/v1/research/answer:
    post:
      tags: [research]
      operationId: answerQuestion
      summary: Answer a legal question within a resolved scope
      description: |
        Runs retrieval → graph step → rerank → generation → trust layer. Returns only when every
        citation has a stored verification (FR-RES-6). If the corpus doesn't support an answer,
        `answerable` is false and `citations` is empty (FR-RES-9).

        Every model call for this request goes only to providers in `allowedProviders` (SEC-11).
        If no allowed provider is configured for a role the pipeline needs, the answer is 503,
        never a fallback to another provider.

        With `credential` (a user's own key, FR-SET-2, ADR-0009), the generation role uses that
        provider, model and key for this request only. A `credential` whose `providerId` is not in
        `allowedProviders`, or is not a known cloud provider, is rejected with 400 before any
        model call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
      responses:
        "200":
          description: Answer with verified citations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Answer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /ai/v1/citations/{citationId}:
    get:
      tags: [sources]
      operationId: getCitation
      summary: A citation with its current stored verification
      parameters:
        - $ref: "#/components/parameters/CitationId"
      responses:
        "200":
          description: Citation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Citation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/v1/sources/{sourceId}:
    get:
      tags: [sources]
      operationId: getSource
      summary: A corpus source record (FR-RES-7)
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/v1/documents/{documentId}/ingestion:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [ingestion]
      operationId: startIngestion
      summary: Start processing an uploaded document (FR-DOC-2, ADR-0010)
      description: |
        Called by apps/api's document job, never by a browser. Answers 202 at once with the
        ingestion's status; the work runs in services/ai's own workers, off the request path
        (SEC-6). services/ai reads the file read-only from the blob store by `storageKey` and
        writes chunks and embeddings to `ai.case_chunks` with the request's `scope.userId` and
        `caseId` (FR-DOC-6). It never writes the `app` schema and never calls apps/api.

        **Idempotent per `(documentId, attempt)`:**
        - the same attempt again (running or finished) changes nothing and returns its status;
        - a higher attempt supersedes the current one: a running attempt is stopped and its
          partial output dropped. The document's existing chunks stay retrievable until the new
          attempt's `index` stage replaces them in one transaction;
        - a lower attempt than the current one is a 409.

        400 if `storageKey` is not exactly `users/{scope.userId}/cases/{caseId}/{documentId}`,
        or `scope.allowedCaseIds` is not `[caseId]`, or `mediaType` is not supported.

        Ingestion sends no document data to a remote model provider in P1: OCR runs locally and
        embeddings in-process (ADR-0008).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestionRequest" }
      responses:
        "202":
          description: Accepted. The status of this attempt, usually `queued`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [ingestion]
      operationId: getIngestion
      summary: The current attempt's status, for polling (FR-DOC-3, NFR-13)
      description: |
        apps/api polls this after `startIngestion` (ADR-0010):
        - **Backoff.** Every 2 s at first, doubling to at most 30 s. If the attempt has not
          finished after 30 minutes, apps/api treats it as `failed` and `retryable`.
        - **Status mapping** to api.v1 `DocumentStatus`: `queued` → `queued`, `running` →
          `processing`, `done` → `done`, `flagged` → `flagged`, `failed` → `failed`.
        - **Retries (NFR-13).** On `failed` with `retryable: true`, apps/api submits
          `attempt + 1` with a delay, up to 3 attempts in all (a deployment setting); the
          document shows `processing` meanwhile. When attempts run out, or `retryable` is
          false, the document is `failed` with `error` and stays listed for the user to retry.
          It is never dropped.
        - **Stage log (FR-DOC-2).** apps/api stores `stages` with the document, so each stage's
          outcome is logged per attempt.

        State is persisted by services/ai, so it survives a restart. An attempt interrupted by a
        restart is reported `failed` with `retryable: true`. 404 if nothing was ever submitted
        for the document (apps/api then submits again) or it has been purged.
      responses:
        "200":
          description: Ingestion status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/v1/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    delete:
      tags: [ingestion]
      operationId: purgeDocument
      summary: Remove everything services/ai holds for a document
      description: |
        Stops a running ingestion and deletes the document's chunks, embeddings and ingestion
        records, so it can never be retrieved again. Idempotent: an unknown or already purged
        document is also a 204. Called by apps/api's retryable purge job (data-storage §6),
        which deletes the blob itself afterwards; services/ai has read-only access to blobs.
      responses:
        "204": { description: Purged }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /ai/v1/precedents/search:
    post:
      tags: [precedents]
      operationId: searchPrecedents
      summary: Find judgments for a query, with graph-derived precedents labelled (FR-PREC-3)
      description: |
        Runs hybrid retrieval over the public corpus's judgments, groups the chunks by judgment
        (`origin: retrieved`), then, when `includeGraphDerived` is true, adds judgments one hop
        away in the graph (`origin: graph_derived`, with `via` saying which edge brought them in,
        ADR-0011):
        - judgments a retrieved judgment cites (`CITES_JUDGMENT`) or that cite it;
        - judgments connected to it (`CONNECTED_CASE`);
        - judgments citing the same statute section (`CITES_SECTION`).

        Every hit carries the graph flags that apply to it, such as `overruled` when an
        `OVERRULES` edge points at it (§9.3 "constrain"). Graph-derived hits are ranked after the
        retrieved hits they came from. A judgment is listed once: if it is both retrieved and
        graph-derived, it is `retrieved`.

        Judgments are public, so the search needs no scope; case documents are never searched.
        If the graph has not been built yet, `graphAvailable` is false and only retrieved hits are
        returned. No model provider is called, so the request carries no `allowedProviders`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrecedentSearchRequest" }
      responses:
        "200":
          description: Hits, best first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecedentSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /ai/v1/precedents/{sourceId}/relationships:
    get:
      tags: [precedents]
      operationId: getPrecedentRelationships
      summary: A judgment's typed relationships, with provenance and status (FR-PREC-2, FR-PREC-4)
      description: |
        Every graph edge into or out of the judgment, one hop. Each carries its provenance (the
        document it was extracted from, how, with what confidence, whether a human confirmed it)
        and its verification status. `OVERRULES` edges exist only from an explicit statement in
        the source metadata or with human confirmation (§9.2). 404 if `sourceId` is not a judgment
        in the corpus.
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Relationships, outgoing first, then incoming
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationshipList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/v1/drafting/templates:
    get:
      tags: [drafting]
      operationId: listDraftTemplates
      summary: The drafting templates (FR-DRAFT-1)
      description: |
        Bail application (s.497/498 CrPC), plaint (Order VII CPC) and legal notice. Each lists its
        fields (with the case field that fills it, FR-DRAFT-2) and its sections in document order.
        A template's `version` changes whenever its fields or sections change.
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ai/v1/drafting/sections:
    post:
      tags: [drafting]
      operationId: draftSection
      summary: Draft one section of a document, with verified citations (FR-DRAFT-3)
      description: |
        Retrieves within `scope` (public corpus plus only the allowed case, FR-CASE-6), asks the
        generation model for the section, and sends every citation through the same trust layer
        as research: existence, then support, then currency (§7.1). Returns only when every
        citation has a stored verification; the statuses are read back from the trust store
        (FR-TRUST-10). A citation that fails is still returned with its stored status, never
        shown as verified (FR-TRUST-8).

        An audit record is written under `requestId` (FR-TRUST-12). Neither the instruction nor
        the fields are stored.

        Providers, credential and 503 follow `answerQuestion` exactly (SEC-11, ADR-0009). 400 if
        the template or section doesn't exist or the section is not `assistable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftSectionRequest" }
      responses:
        "200":
          description: The drafted section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSectionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /ai/v1/lint/rulesets:
    get:
      tags: [linter]
      operationId: listLintRulesets
      summary: The linter's rule sets (FR-LINT-1, FR-LINT-2)
      responses:
        "200":
          description: Rule sets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LintRulesetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ai/v1/lint:
    post:
      tags: [linter]
      operationId: lintDocument
      summary: Lint a document's text against its rule set (FR-LINT-1, FR-LINT-3)
      description: |
        Checks required sections, required particulars and structure, and returns one finding
        per problem. Deterministic: the same text and rule-set version give the same findings,
        and no model provider is called (ADR-0012). The text is never modified or stored;
        `inputSha256` is the SHA-256 of the text's UTF-8 bytes as received, so a caller can show
        the document is unchanged (FR-LINT-3). Each finding cites its rule source or has
        `source: null`, meaning none was identified (FR-LINT-2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LintRequest" }
      responses:
        "200":
          description: Findings in document order; findings without a span come last
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LintResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Shared AI_SERVICE_TOKEN; only apps/api holds it.

  parameters:
    CitationId:
      name: citationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: The document's id in apps/api (`app.documents`).
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid service token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with the resource's current state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: A dependency (database or model provider) is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      description: RFC 9457 problem details
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Scope:
      description: Access scope resolved by apps/api. Applied inside SQL; never widened (FR-CASE-6).
      type: object
      required: [userId, accountId, allowedCaseIds]
      properties:
        userId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        allowedCaseIds:
          description: Cases whose private documents may be retrieved. Empty = public corpus only.
          type: array
          items: { type: string, format: uuid }

    Language:
      type: string
      enum: [en, ur, roman_ur]

    ProviderId:
      description: |
        Stable model-provider key, such as `gemini` or `ollama` (ADR-0005). Shared with api.v1,
        where the Admin's allow-list uses the same keys.
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      examples: [gemini, ollama]

    Turn:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }

    AnswerRequest:
      type: object
      required: [requestId, question, scope]
      properties:
        requestId:
          description: Correlation ID from apps/api; also the audit record key (FR-TRUST-12).
          type: string
          format: uuid
        question: { type: string, minLength: 1, maxLength: 4000 }
        language:
          description: Omit to auto-detect (§8.3).
          allOf: [{ $ref: "#/components/schemas/Language" }]
        lawAsOf:
          description: Answer "law as of date D" for curated sections (FR-RES-11, FR-TEMP-5).
          type: string
          format: date
        history:
          description: Earlier turns of the conversation, oldest first (FR-RES-8).
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Turn" }
        scope: { $ref: "#/components/schemas/Scope" }
        allowedProviders:
          description: |
            Model providers this request's data may be sent to: the Admin's allow-list, resolved
            by apps/api (FR-AUTH-3, SEC-11). services/ai never widens it. Omitted means local
            providers only (for example Ollama), so a caller that forgets it fails closed.
          type: array
          uniqueItems: true
          maxItems: 32
          items: { $ref: "#/components/schemas/ProviderId" }
        credential:
          description: |
            Optional. The user's own key and chosen model (FR-SET-2, ADR-0009), decrypted by
            apps/api for this request. Omitted means unchanged behaviour: env-configured providers
            only.
          allOf: [{ $ref: "#/components/schemas/Credential" }]

    Credential:
      description: |
        A user-supplied model credential for one request (FR-SET-2, SEC-4, SEC-11, ADR-0009).

        - Rejected with 400 unless `providerId` is in `allowedProviders` **and** is a known cloud
          provider (a preset in `gateway/providers.py`; local providers such as `ollama` are
          keyless and never take a credential).
        - Overrides the **generation** role only, for this request only. Other roles keep the
          deployment's configuration.
        - `apiKey` is never logged, stored, put in the answer trace or returned. services/ai
          keeps no copy after the request.
      type: object
      required: [providerId, model, apiKey]
      additionalProperties: false
      properties:
        providerId: { $ref: "#/components/schemas/ProviderId" }
        model:
          description: The provider's model id, for example `gemini-2.0-flash`.
          type: string
          minLength: 1
          maxLength: 200
        apiKey:
          description: The plaintext provider key. Secret; never logged or stored.
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true

    Answer:
      type: object
      required: [requestId, answerable, language, text, citations]
      properties:
        requestId: { type: string, format: uuid }
        answerable:
          description: False when the corpus doesn't support an answer (FR-RES-9).
          type: boolean
        language: { $ref: "#/components/schemas/Language" }
        text:
          description: |
            Answer text in the user's language. Citation markers appear as `[[c:<citationId>]]`
            at the claim they support.
          type: string
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        asOfNote:
          description: |
            Present only when the request gave `lawAsOf` (FR-RES-11): in the answer's language,
            says that judgments decided after that date were excluded and that statute text is
            the current version, because historical versions are not curated yet.
          type: string

    Citation:
      type: object
      required: [id, sourceId, claim, verification]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        claim:
          description: The claim in the answer that this citation supports.
          type: string
        locator:
          description: Section, article or paragraph within the source.
          type: string
          examples: ["s. 497", "para 14"]
        quote:
          description: Verbatim span in the source's original language (FR-RES-10).
          type: string
        quoteLanguage: { $ref: "#/components/schemas/Language" }
        verification: { $ref: "#/components/schemas/Verification" }

    Verification:
      description: Stored trust-layer result (§7). Exactly one status per citation (FR-TRUST-4).
      type: object
      required: [status, flags, lastVerifiedAt]
      properties:
        status: { $ref: "#/components/schemas/TrustStatus" }
        flags:
          type: array
          items: { $ref: "#/components/schemas/TrustFlag" }
        lastVerifiedAt: { type: string, format: date-time }
        checks:
          type: object
          properties:
            existence: { type: string, enum: [pass, fail] }
            support: { type: string, enum: [pass, uncertain, fail, not_run] }
            currency: { type: string, enum: [current, historical, unknown] }
            support_method:
              description: >-
                How the support verdict was reached: "nli", or "nli+llm" when the NLI model was
                uncertain and the judge decided (FR-TRUST-3). Only present when support ran.
              type: string
            support_score:
              description: P(entailment) from the NLI model, 0 to 1. Only present when support ran.
              type: number
              minimum: 0
              maximum: 1

    Source:
      type: object
      required: [id, kind, title, officialUrl, language]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [statute, judgment, rule, other] }
        title: { type: string }
        citation:
          description: Reported citation, e.g. "PLD 2023 SC 1".
          type: string
        court: { type: string }
        decidedOn: { type: string, format: date }
        officialUrl:
          description: Public URL of the original on the official source (FR-RES-7).
          type: string
          format: uri
        sourceTier:
          description: Source register tier (§15.2).
          type: integer
          enum: [1, 2]
        thirdParty: { type: boolean }
        headnoteOnly: { type: boolean }
        language: { $ref: "#/components/schemas/Language" }
        excerpt:
          description: Text around the cited locator, verbatim.
          type: string
        retrievedAt: { type: string, format: date-time }

    DocumentMediaType:
      description: |
        The file types a user can upload (FR-DOC-1): PDF, DOCX, and scanned pages as PNG, JPEG
        or TIFF. Shared with api.v1, which accepts exactly these, so services/ai can process every
        file the API stores. apps/api finds the type by sniffing the content, never from the
        client's header or the file extension.
      type: string
      enum:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - image/png
        - image/jpeg
        - image/tiff

    DocumentStage:
      description: |
        The processing stages of FR-DOC-2, in order. `ocr` runs only where a page has no text
        layer (scans and images); English only in P1.
      type: string
      enum: [ocr, extract, clean, structure, chunk, embed, index]

    DocumentFlag:
      description: |
        Something uncertain found while processing (FR-DOC-4). A flagged document is retrievable,
        but the flagged part is never shown as clean. Shared with api.v1.
      type: object
      required: [stage, code, message, page]
      properties:
        stage: { $ref: "#/components/schemas/DocumentStage" }
        code:
          description: |
            Machine-readable reason, snake_case. Known codes: `low_ocr_confidence`,
            `unreadable_page`, `no_text`, `not_english`, `table_not_extracted`,
            `encrypted_file`, `truncated`. New codes can be added without a contract change, so a
            consumer shows `message` for a code it doesn't know.
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          examples: [low_ocr_confidence]
        message:
          description: For the user, in English. Says what is uncertain, not how to fix the pipeline.
          type: string
          maxLength: 500
          examples: ["Page 3 was hard to read; check the text against the original."]
        page:
          description: 1-based page number, or null when the flag is about the whole document.
          type: [integer, "null"]
          minimum: 1

    IngestionRequest:
      type: object
      required: [scope, caseId, storageKey, mediaType, filename, attempt]
      additionalProperties: false
      properties:
        scope:
          description: |
            The document owner's scope, resolved by apps/api. `allowedCaseIds` is exactly
            `[caseId]`; chunks are written with `scope.userId` and `caseId` (FR-DOC-6).
          allOf: [{ $ref: "#/components/schemas/Scope" }]
        caseId: { type: string, format: uuid }
        storageKey:
          description: |
            Blob key of the original file (data-storage §6). Must be exactly
            `users/{scope.userId}/cases/{caseId}/{documentId}`, else 400. Read-only.
          type: string
          pattern: "^users/[0-9a-f-]{36}/cases/[0-9a-f-]{36}/[0-9a-f-]{36}$"
        mediaType: { $ref: "#/components/schemas/DocumentMediaType" }
        filename:
          description: The original filename, for logs and locators only. Never used as a path.
          type: string
          minLength: 1
          maxLength: 255
        attempt:
          description: 1 for the first run; apps/api increases it for each retry (NFR-13).
          type: integer
          minimum: 1

    IngestionState:
      description: |
        `flagged`: finished and retrievable, with at least one `DocumentFlag`. `failed`: nothing
        from this attempt is retrievable; see `error` and `retryable`.
      type: string
      enum: [queued, running, done, flagged, failed]

    IngestionStage:
      description: One stage's outcome in an attempt (FR-DOC-2 "each stage outcome is logged").
      type: object
      required: [stage, state, startedAt, finishedAt, flags]
      properties:
        stage: { $ref: "#/components/schemas/DocumentStage" }
        state:
          description: "`skipped` when the stage isn't needed, such as `ocr` for a page with a text layer."
          type: string
          enum: [pending, running, done, flagged, failed, skipped]
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        flags:
          type: array
          items: { $ref: "#/components/schemas/DocumentFlag" }

    IngestionStatus:
      type: object
      required: [documentId, attempt, state, stages, flags, error, retryable, pages, chunkCount]
      properties:
        documentId: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/IngestionState" }
        stages:
          description: Every stage of `DocumentStage`, in order.
          type: array
          items: { $ref: "#/components/schemas/IngestionStage" }
        flags:
          description: All flags of the attempt, from every stage.
          type: array
          items: { $ref: "#/components/schemas/DocumentFlag" }
        error:
          description: Set only when `state` is `failed`. For the user, in English; no stack traces or paths.
          type: [string, "null"]
          maxLength: 500
        retryable:
          description: |
            When `failed`: whether another attempt may succeed (a timeout, a restart, a dependency
            down) or not (a corrupt or encrypted file). False in every other state.
          type: boolean
        pages: { type: [integer, "null"], minimum: 0 }
        chunkCount:
          description: Chunks indexed, once `done` or `flagged`; null before.
          type: [integer, "null"]
          minimum: 0

    TrustStatus:
      description: The trust-layer status (§7.2). Exactly one per citation (FR-TRUST-4).
      type: string
      enum: [verified, needs_review, unverified]

    TrustFlag:
      description: |
        A trust-layer flag (§7.2). Blocking flags force `needs_review`: `overruled`, `repealed`,
        `superseded_version`, `conflict`. The others are non-blocking and shown as chips.
      type: string
      enum:
        # blocking (force needs_review)
        - overruled
        - repealed
        - superseded_version
        - conflict
        # non-blocking (shown as chips)
        - stale
        - third_party_source
        - headnote_only
        - amended_since

    GraphEntityType:
      description: Entity types of the P0 graph taxonomy (§9.2).
      type: string
      enum: [statute, section, judgment, court, amendment_act]

    GraphEdgeType:
      description: |
        Edge types of the P0 graph taxonomy (§9.2). `OVERRULES` edges are created only from an
        explicit statement in the source metadata or with human confirmation, never from model
        inference alone.
      type: string
      enum: [CITES_SECTION, CITES_JUDGMENT, AMENDS, SUBSTITUTES, INSERTS, OMITS, REPEALS, OVERRULES, CONNECTED_CASE]

    PrecedentFilters:
      description: All optional; an omitted filter doesn't narrow the search.
      type: object
      additionalProperties: false
      properties:
        court:
          description: Exact court name as stored, e.g. "Sindh High Court".
          type: string
          maxLength: 120
        area:
          description: Area of law from the case taxonomy (`case-taxonomy.v1.yaml`).
          type: string
          maxLength: 80
        decidedFrom: { type: string, format: date }
        decidedTo: { type: string, format: date }
        sectionRef:
          description: Only judgments citing this statute section, e.g. "s.497 CrPC".
          type: string
          maxLength: 120

    PrecedentSearchRequest:
      type: object
      required: [requestId, query]
      additionalProperties: false
      properties:
        requestId:
          description: Correlation ID from apps/api; also the audit record key.
          type: string
          format: uuid
        query: { type: string, minLength: 1, maxLength: 1000 }
        filters: { $ref: "#/components/schemas/PrecedentFilters" }
        includeGraphDerived:
          type: boolean
          default: true
        limit:
          description: Maximum number of hits, retrieved and graph-derived together.
          type: integer
          minimum: 1
          maximum: 50
          default: 20

    PrecedentVia:
      description: The graph edge that brought a graph-derived hit in.
      type: object
      required: [edgeId, type, relatedSourceId, sectionLabel]
      properties:
        edgeId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/GraphEdgeType" }
        relatedSourceId:
          description: The retrieved judgment this hit is linked to.
          type: string
          format: uuid
        sectionLabel:
          description: For `CITES_SECTION`, the section both judgments cite; null otherwise.
          type: [string, "null"]
          examples: ["s.497 CrPC"]

    PrecedentHit:
      description: One judgment. Every field is present (`null` when unknown).
      type: object
      required: [sourceId, title, citation, court, decidedOn, origin, via, flags, locator, snippet, score]
      properties:
        sourceId: { type: string, format: uuid }
        title: { type: string }
        citation: { type: [string, "null"], examples: ["2023 SCMR 100"] }
        court: { type: [string, "null"] }
        decidedOn: { type: [string, "null"], format: date }
        origin:
          description: "`graph_derived` hits are labelled as such wherever they are shown (FR-PREC-3)."
          type: string
          enum: [retrieved, graph_derived]
        via:
          description: Set only when `origin` is `graph_derived`.
          oneOf:
            - { $ref: "#/components/schemas/PrecedentVia" }
            - { type: "null" }
        flags:
          description: Graph flags on the judgment, e.g. `overruled` (§9.3).
          type: array
          items: { $ref: "#/components/schemas/TrustFlag" }
        locator:
          description: The best-matching passage's locator; null for graph-derived hits.
          type: [string, "null"]
          examples: ["para 14"]
        snippet:
          description: The best-matching passage, verbatim, at most 500 characters; null for graph-derived hits.
          type: [string, "null"]
          maxLength: 500
        score:
          description: Ranking score, higher is better. Only comparable within one result.
          type: number

    PrecedentSearchResult:
      type: object
      required: [requestId, hits, graphAvailable]
      properties:
        requestId: { type: string, format: uuid }
        hits:
          type: array
          items: { $ref: "#/components/schemas/PrecedentHit" }
        graphAvailable:
          description: False when the graph has not been built, so no hit can be graph-derived.
          type: boolean

    Relationship:
      description: One graph edge seen from a judgment. Every field is present (`null` when unknown).
      type: object
      required: [id, type, direction, other, provenance, verificationStatus, validFrom, validTo, recordedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/GraphEdgeType" }
        direction:
          description: "`outgoing`: this judgment → `other`. `incoming`: `other` → this judgment."
          type: string
          enum: [outgoing, incoming]
        other: { $ref: "#/components/schemas/GraphEntityRef" }
        provenance: { $ref: "#/components/schemas/EdgeProvenance" }
        verificationStatus: { $ref: "#/components/schemas/TrustStatus" }
        validFrom: { type: [string, "null"], format: date }
        validTo: { type: [string, "null"], format: date }
        recordedAt: { type: string, format: date-time }

    GraphEntityRef:
      type: object
      required: [entityType, sourceId, label]
      properties:
        entityType: { $ref: "#/components/schemas/GraphEntityType" }
        sourceId:
          description: The corpus record, when the entity is one (a judgment or statute); else null.
          type: [string, "null"]
          format: uuid
        label: { type: string, examples: ["s.497 CrPC", "2019 SCMR 1234"] }

    EdgeProvenance:
      description: Where a graph edge comes from (FR-GRAPH-1).
      type: object
      required: [documentId, extractionMethod, confidence, humanConfirmed]
      properties:
        documentId:
          description: The corpus document the edge was extracted from.
          type: [string, "null"]
          format: uuid
        extractionMethod:
          description: "`metadata`: the collector's structured metadata. `regex`: matched in the text. `human`: entered or confirmed by a person."
          type: string
          enum: [metadata, regex, human]
        confidence: { type: number, minimum: 0, maximum: 1 }
        humanConfirmed: { type: boolean }

    RelationshipList:
      type: object
      required: [sourceId, items]
      properties:
        sourceId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/Relationship" }

    DraftTemplateId:
      type: string
      enum: [bail_application, plaint, legal_notice]

    CaseField:
      description: |
        A field of api.v1 `Case` that can fill a template field (FR-DRAFT-2). List fields
        (`parties`, `relevantLaws`) are filled as one line per entry.
      type: string
      enum: [title, court, caseNumber, caseType, filedOn, status, nextHearingOn, parties, judge, assignedLawyer, relevantLaws, summary]

    DraftTemplateField:
      type: object
      required: [key, label, required, caseField]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        label: { type: string }
        required: { type: boolean }
        caseField:
          description: The case field that fills this one when a case is selected; null if none.
          oneOf:
            - { $ref: "#/components/schemas/CaseField" }
            - { type: "null" }

    DraftTemplateSection:
      type: object
      required: [key, heading, required, assistable, guidance]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        heading: { type: string, examples: ["Grounds for bail"] }
        required: { type: boolean }
        assistable:
          description: Whether `draftSection` can draft it.
          type: boolean
        guidance:
          description: What the section should contain, for the user.
          type: string

    DraftTemplate:
      type: object
      required: [id, version, title, description, fields, sections]
      properties:
        id: { $ref: "#/components/schemas/DraftTemplateId" }
        version: { type: string, examples: ["1"] }
        title: { type: string, examples: ["Bail application (s.497 CrPC)"] }
        description: { type: string }
        fields:
          description: The particulars the user fills in, in display order.
          type: array
          items: { $ref: "#/components/schemas/DraftTemplateField" }
        sections:
          description: The document's sections, in document order.
          type: array
          items: { $ref: "#/components/schemas/DraftTemplateSection" }

    DraftTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DraftTemplate" }

    DraftSectionBody:
      type: object
      required: [key, body]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        body:
          description: Plain text. Citation markers appear as `[[c:<citationId>]]`.
          type: string
          maxLength: 20000

    DraftSectionRequest:
      type: object
      required: [requestId, templateId, sectionKey, fields, otherSections, scope]
      additionalProperties: false
      properties:
        requestId:
          description: Correlation ID from apps/api; also the audit record key (FR-TRUST-12).
          type: string
          format: uuid
        templateId: { $ref: "#/components/schemas/DraftTemplateId" }
        sectionKey: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        instruction:
          description: Optional guidance from the user for this section.
          type: string
          maxLength: 2000
        fields:
          description: The draft's field values by key. Unknown keys are ignored.
          type: object
          additionalProperties: { type: [string, "null"], maxLength: 4000 }
        otherSections:
          description: The draft's other sections as they stand, for context.
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/DraftSectionBody" }
        scope: { $ref: "#/components/schemas/Scope" }
        allowedProviders:
          description: As in `AnswerRequest`. Omitted means local providers only.
          type: array
          uniqueItems: true
          maxItems: 32
          items: { $ref: "#/components/schemas/ProviderId" }
        credential:
          description: As in `AnswerRequest` (ADR-0009).
          allOf: [{ $ref: "#/components/schemas/Credential" }]

    DraftSectionResult:
      type: object
      required: [requestId, text, citations]
      properties:
        requestId: { type: string, format: uuid }
        text:
          description: The section's text. Citation markers appear as `[[c:<citationId>]]`.
          type: string
        citations:
          description: Read back from the trust store (FR-TRUST-10).
          type: array
          items: { $ref: "#/components/schemas/Citation" }

    LintDocumentType:
      type: string
      enum: [bail_application, plaint]

    LintFindingKind:
      type: string
      enum: [missing_section, missing_particular, structure]

    LintSeverity:
      description: "`error`: the court is likely to return the document. `warning`: probably a defect. `info`: good practice."
      type: string
      enum: [error, warning, info]

    LintRuleSource:
      description: Where a rule comes from (FR-LINT-2).
      type: object
      required: [provision, reference]
      properties:
        provision:
          type: string
          examples: ["s.497 CrPC", "Order VII r.1 CPC"]
        reference:
          description: The corpus source for the provision, when it is in the corpus; else null.
          type: [string, "null"]
          format: uuid

    LintRule:
      type: object
      required: [id, kind, severity, title, source]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_.]{0,63}$", examples: ["bail.grounds"] }
        kind: { $ref: "#/components/schemas/LintFindingKind" }
        severity: { $ref: "#/components/schemas/LintSeverity" }
        title: { type: string }
        source:
          description: Null means no rule source was identified (FR-LINT-2).
          oneOf:
            - { $ref: "#/components/schemas/LintRuleSource" }
            - { type: "null" }

    LintRuleset:
      type: object
      required: [id, documentType, version, title, rules]
      properties:
        id: { type: string, examples: ["bail_application"] }
        documentType: { $ref: "#/components/schemas/LintDocumentType" }
        version: { type: string, examples: ["1"] }
        title: { type: string }
        rules:
          type: array
          items: { $ref: "#/components/schemas/LintRule" }

    LintRulesetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LintRuleset" }

    LintRequest:
      type: object
      required: [requestId, documentType, text]
      additionalProperties: false
      properties:
        requestId: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/LintDocumentType" }
        text: { type: string, minLength: 1, maxLength: 200000 }

    LintSpan:
      description: |
        A range of the text, `[start, end)`, in UTF-16 code units, so a JavaScript client can
        slice the string directly.
      type: object
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }

    LintFinding:
      type: object
      required: [ruleId, kind, severity, message, span, source]
      properties:
        ruleId: { type: string }
        kind: { $ref: "#/components/schemas/LintFindingKind" }
        severity: { $ref: "#/components/schemas/LintSeverity" }
        message:
          description: For the user, in English.
          type: string
        span:
          description: Where the problem is; null when something is missing from the whole document.
          oneOf:
            - { $ref: "#/components/schemas/LintSpan" }
            - { type: "null" }
        source:
          description: The rule's source; null means none was identified (FR-LINT-2).
          oneOf:
            - { $ref: "#/components/schemas/LintRuleSource" }
            - { type: "null" }

    LintResult:
      type: object
      required: [requestId, rulesetId, rulesetVersion, inputSha256, findings]
      properties:
        requestId: { type: string, format: uuid }
        rulesetId: { type: string }
        rulesetVersion: { type: string }
        inputSha256:
          description: SHA-256 of the text's UTF-8 bytes, lowercase hex (FR-LINT-3).
          type: string
          pattern: "^[0-9a-f]{64}$"
        findings:
          type: array
          items: { $ref: "#/components/schemas/LintFinding" }
