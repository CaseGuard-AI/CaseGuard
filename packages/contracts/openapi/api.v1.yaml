openapi: 3.1.0
info:
  title: CaseGuard public API
  version: 1.0.0-draft
  summary: REST API served by apps/api and consumed by apps/web.
  description: |
    M1 vertical slice: auth, ask a question, an answer with verified citations, and opening a cited source.
    M3 adds cases (FR-CASE): the user's own matters, with the fields of Deliverable II Table 4.29,
    and saving research to a case. It also adds documents (FR-DOC): files uploaded to a case,
    processed in the background, with their status and any uncertain parts flagged. And it adds
    notifications (FR-NOT-1): a document's processing finished, was flagged or failed. It also
    adds precedent search over the knowledge graph (FR-PREC), drafting from templates with
    AI-assisted sections (FR-DRAFT), and procedural lint reports (FR-LINT).

    - **Auth.** A short-lived access token (JWT) is sent as `Authorization: Bearer`. The refresh
      token lives only in an HttpOnly, Secure, SameSite=Strict cookie scoped to `/api/v1/auth`.
    - **Errors** use RFC 9457 `application/problem+json`.
    - **Trust shapes** (Citation, Verification, Source) are shared with the internal AI contract,
      so a status means the same thing on both sides (FR-TRUST-10).
  license:
    name: Proprietary (FYP)
    identifier: LicenseRef-CaseGuard-FYP
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: ops
    description: Liveness
  - name: auth
    description: Accounts and sessions (FR-AUTH)
  - name: settings
    description: The signed-in user's own preferences (FR-SET)
  - name: research
    description: Conversations and answers (FR-RES)
  - name: cases
    description: The signed-in user's own matters (FR-CASE). Owner only; another user's case is a 404 (FR-AUTH-4)
  - name: documents
    description: Files uploaded to a case and their processing (FR-DOC). Owner only; another user's document is a 404 (FR-AUTH-4)
  - name: notifications
    description: The signed-in user's own notifications (FR-NOT-1). Owner only; another user's notification is a 404 (FR-AUTH-4)
  - name: precedents
    description: Judgment search with graph-derived precedents and their relationships (FR-PREC)
  - name: drafting
    description: Templates and the signed-in user's own drafts (FR-DRAFT). Owner only; another user's draft is a 404 (FR-AUTH-4)
  - name: linter
    description: Procedural lint reports for a bail application or plaint (FR-LINT). Owner only; another user's report is a 404 (FR-AUTH-4)
  - name: sources
    description: Citations and source records (FR-RES-7, FR-TRUST)
  - name: admin
    description: AI access and model providers. Admin role only; Lawyers and Researchers get 403 (FR-AUTH-2, FR-AUTH-3)

paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account as a Lawyer or Researcher (FR-AUTH-1, FR-AUTH-2)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in (FR-AUTH-1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh cookie and issue a new access token
      security:
        - refreshCookie: []
      responses:
        "200":
          description: New session
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the refresh token and clear the cookie
      security:
        - refreshCookie: []
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password reset (FR-AUTH-1)
      description: |
        Always answers 202, whether or not the email has an account, so the response doesn't
        reveal which emails are registered. If it does, a single-use reset token that expires
        after a short time is sent to that address out of band. The token never appears in an
        API response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202": { description: "Accepted. If the account exists, a reset link is on its way." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token (FR-AUTH-1)
      description: |
        Spends the token and sets the new password. Every existing session of the user is
        revoked, so the user signs in again with the new password. An unknown, used or expired
        token gives 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { description: "Password changed. Existing sessions are revoked." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/settings:
    get:
      tags: [settings]
      operationId: getMySettings
      summary: The signed-in user's settings (FR-SET-1)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [settings]
      operationId: updateMySettings
      summary: Change some of the signed-in user's settings (FR-SET-1)
      description: |
        Partial update: send only the fields that change. Always the caller's own settings
        (FR-AUTH-4). The change applies from the next request. `User` (from `getMe` and the
        session) shows a new `name` or `locale` after the next refresh.

        `defaultModel` (FR-SET-2): `null` clears it. A `DefaultModel` is checked against
        `listModels`: 403 if `providerId` is not an enabled provider (unknown ids included), and
        400 if `model` is not in that provider's `models`. Nothing is changed when either check
        fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSettingsUpdate" }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/keys:
    get:
      tags: [settings]
      operationId: listMyKeys
      summary: The signed-in user's saved model-provider keys (FR-SET-2, SEC-4)
      description: |
        One entry per provider the caller has saved a key for, ordered by `providerId`. Never
        returns a key, only its last four characters (ADR-0009). A key for a provider the Admin
        has since disabled is still listed (so it can be deleted) but is not used.
      responses:
        "200":
          description: The caller's keys, without the secret
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/keys/{providerId}:
    parameters:
      - $ref: "#/components/parameters/KeyProviderId"
    put:
      tags: [settings]
      operationId: putMyKey
      summary: Save or replace the caller's key for one provider (FR-SET-2, SEC-4, SEC-11)
      description: |
        Creates the key, or replaces the existing one for this provider (same 200 either way).
        Stored encrypted (AES-256-GCM, ADR-0009); the response carries only `last4`.

        403 if the provider is not enabled on the Admin allow-list (unknown ids included), or is
        a `local` provider (for example `ollama`, which takes no key). 400 if the body is
        invalid. The key is never logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserKeyInput" }
      responses:
        "200":
          description: The saved key, without the secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [settings]
      operationId: deleteMyKey
      summary: Delete the caller's key for one provider (FR-SET-2)
      description: |
        Works whether or not the provider is still enabled. `defaultModel` is left as it is;
        without a key, questions use the deployment's own configuration.
      responses:
        "204": { description: "Key deleted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /models:
    get:
      tags: [settings]
      operationId: listModels
      summary: The enabled model providers and the models each offers (FR-SET-2, SEC-11)
      description: |
        Only providers enabled on the Admin allow-list, ordered by `name`. `models` comes from
        the deployment's model catalog (ADR-0005) and is what `defaultModel` is checked against.
        `hasKey` says whether the caller has saved a key for that provider (always false for
        `local` providers, which take none).
      responses:
        "200":
          description: Enabled providers with their models
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderModels" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations:
    get:
      tags: [research]
      operationId: listConversations
      summary: The user's conversations, newest first (FR-RES-8)
      parameters:
        - $ref: "#/components/parameters/ConversationCaseId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationSummary" }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [research]
      operationId: createConversation
      summary: Start a conversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                caseId:
                  description: |
                    Save the conversation to one of the signed-in user's active cases (FR-CASE-5),
                    which also scopes retrieval to that case (FR-CASE-6). A case that is not the
                    caller's, or is archived, is a 400 with `errors[].path` of `caseId`.
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations/{conversationId}:
    get:
      tags: [research]
      operationId: getConversation
      summary: A conversation with its messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [research]
      operationId: updateConversation
      summary: Save a conversation to a case, or detach it (FR-CASE-5, FR-RES-8)
      description: |
        Later questions in the conversation are scoped to the new case (FR-CASE-6); earlier
        answers are unchanged. The case rule is the same as for `createConversation`: it must be
        the caller's and active, else 400. `null` detaches the conversation from its case.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: The conversation after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{conversationId}/messages:
    post:
      tags: [research]
      operationId: askQuestion
      summary: Ask a question and get an answer with verified citations
      description: |
        Responds only after every citation has a stored verification (FR-RES-6). Returns 403 if
        AI features are disabled for the user (FR-AUTH-3).
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "201":
          description: The assistant's answer message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: The user's cases, most recently updated first (FR-CASE-1)
      parameters:
        - $ref: "#/components/parameters/CaseState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of cases
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Case" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cases]
      operationId: createCase
      summary: Create a case (FR-CASE-1)
      description: |
        The case belongs to the signed-in user (FR-AUTH-4, FR-AUTH-5). The validation rules are
        the field rules of `CaseFields`; a failure is a 400 with `errors[]` and nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cases/{caseId}:
    get:
      tags: [cases]
      operationId: getCase
      summary: A case, the root of its dashboard (FR-CASE-4)
      description: |
        Research saved to the case is `listConversations` with `caseId`. Documents, drafts and
        precedents are listed by their own operations with the same filter once they exist.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [cases]
      operationId: updateCase
      summary: Change some of a case's fields (FR-CASE-1)
      description: |
        Partial update: send only the fields that change. A successful save sets `updatedAt`.
        An archived case can still be edited. Invalid values are a 400 with `errors[]` and
        nothing is saved.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseUpdate" }
      responses:
        "200":
          description: The case after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cases/{caseId}/archive:
    post:
      tags: [cases]
      operationId: archiveCase
      summary: Archive a case (FR-CASE-1)
      description: |
        Sets `archivedAt` and hides the case from `listCases` unless `state` asks for it. Nothing
        is deleted: its conversations and documents stay, but no new conversation can be saved
        to it. Archiving an archived case changes nothing and is still a 200.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The archived case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cases/{caseId}/unarchive:
    post:
      tags: [cases]
      operationId: unarchiveCase
      summary: Bring an archived case back (FR-CASE-1)
      description: Clears `archivedAt`. Unarchiving an active case changes nothing and is still a 200.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The active case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cases/{caseId}/documents:
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a file to a case (FR-DOC-1, SEC-6)
      description: |
        One file per request, as the `file` part of a `multipart/form-data` body. The file is
        stored outside the web root and queued for processing; nothing is processed on the
        request path (SEC-6). The response is the document in status `queued`; follow it with
        `getDocument` or `listDocuments` (FR-DOC-3).

        - **Type (FR-DOC-1).** PDF, DOCX, PNG, JPEG or TIFF (`DocumentMediaType`), found by
          sniffing the content. The part's `Content-Type` and the filename's extension are
          ignored. Anything else is a 415 and nothing is stored.
        - **Size.** At most 25 MB (26 214 400 bytes). A larger body is cut off and answered 413.
        - **Case.** It must be the caller's (else 404) and active: an archived case is a 400
          with `errors[].path` of `caseId`.
        - **Filename.** Taken from the part's `filename`, without any directory, with control
          characters removed, at most 255 characters. It is stored only in the database, never
          in the blob key (data-storage §6).

        Typed clients: the generated type of `file` is `string`. Send a `FormData` through a
        body serializer, for example openapi-fetch's `bodySerializer`.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DocumentUpload" }
            encoding:
              file:
                contentType: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/png, image/jpeg, image/tiff
      responses:
        "201":
          description: Stored and queued for processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: The user's documents, newest first (FR-DOC-3, FR-CASE-4)
      description: |
        Every document of the caller, in any status, also those of archived cases. With
        `caseId`, the case dashboard's documents. Deleted documents are never listed.
      parameters:
        - $ref: "#/components/parameters/DocumentCaseId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [documents]
      operationId: getDocument
      summary: A document and its processing status (FR-DOC-3, FR-DOC-4)
      description: |
        Poll this while the status is `queued` or `processing`. A `flagged` document is
        retrievable in research, but its `flags` must be shown with it: it is never shown as
        clean (FR-DOC-4).
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document, its file and everything derived from it
      description: |
        Works in any status, also in an archived case. The document is gone from the API at
        once (`getDocument` is a 404 and research no longer retrieves it); the file and its
        chunks are purged by a background job that is retried until it succeeds
        (data-storage §6). Deleting is final.
      responses:
        "202": { description: "Deleted. The purge of the file and chunks is queued." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/file:
    get:
      tags: [documents]
      operationId: downloadDocument
      summary: The original file, as uploaded
      description: |
        Streamed through the API after the ownership check; there are no direct storage links
        (data-storage §6). Served with the stored `mediaType`, `Content-Disposition: attachment`
        with the stored filename, and `X-Content-Type-Options: nosniff`. Available in every
        status.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The file
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"…\"; filename*=UTF-8''…`"
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
          content:
            application/pdf:
              schema: &binaryFile { type: string, contentMediaType: application/octet-stream }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: *binaryFile
            image/png:
              schema: *binaryFile
            image/jpeg:
              schema: *binaryFile
            image/tiff:
              schema: *binaryFile
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/retry:
    post:
      tags: [documents]
      operationId: retryDocument
      summary: Process a failed or flagged document again (NFR-13)
      description: |
        Starts a new processing attempt from the stored file. Only from `failed` or `flagged`;
        any other status is a 409. The document returns to `queued` and `error` is cleared. A
        flagged document stays retrievable with its current chunks until the new attempt
        finishes, so its `flags` stay too, until the new attempt replaces them (FR-DOC-4).
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: Queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The user's notifications, newest first (FR-NOT-1)
      description: |
        The header bell polls this. `unreadCount` is the caller's unread total, whatever the
        filter and the page, so the bell can show a dot without loading the list. A notification
        carries no display text: the client words it from `kind` and `filename`, in the user's
        language.
      parameters:
        - $ref: "#/components/parameters/NotificationUnread"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of notifications
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  nextCursor: { type: [string, "null"] }
                  unreadCount: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/{notificationId}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one notification read
      description: Idempotent; a notification that is already read keeps its first `readAt`.
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204": { description: Read }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark every notification of the caller read
      responses:
        "204": { description: All read }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /precedents/search:
    post:
      tags: [precedents]
      operationId: searchPrecedents
      summary: Search judgments, with graph-derived precedents labelled (FR-PREC-1, FR-PREC-3)
      description: |
        Searches the public corpus's judgments and, unless `includeGraphDerived` is false, adds
        judgments one hop away in the knowledge graph. Graph-derived hits have `origin:
        graph_derived` and a `via` edge, and the UI labels them as such (FR-PREC-3). Flags such as
        `overruled` come from the graph (§9.3). No model provider is called, so this works when AI
        features are disabled for the user. Each search writes an audit record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrecedentSearch" }
      responses:
        "200":
          description: Hits, best first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecedentSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /precedents/{sourceId}/relationships:
    get:
      tags: [precedents]
      operationId: getPrecedentRelationships
      summary: A judgment's typed relationships with provenance and status (FR-PREC-2, FR-PREC-4)
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Relationships, outgoing first, then incoming
          content:
            application/json:
              schema: { $ref: "./ai.v1.yaml#/components/schemas/RelationshipList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /drafting/templates:
    get:
      tags: [drafting]
      operationId: listDraftTemplates
      summary: The drafting templates (FR-DRAFT-1)
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "./ai.v1.yaml#/components/schemas/DraftTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /drafts:
    get:
      tags: [drafting]
      operationId: listDrafts
      summary: The user's drafts, most recently updated first (FR-CASE-4)
      parameters:
        - $ref: "#/components/parameters/DraftCaseId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of drafts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DraftSummary" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [drafting]
      operationId: createDraft
      summary: Start a draft from a template, optionally filled from a case (FR-DRAFT-1, FR-DRAFT-2)
      description: |
        With `caseId`, every template field with a `caseField` is filled from the case, and the
        draft is saved to the case (FR-CASE-5); the case must be the caller's and active, else 400
        with `errors[].path` of `caseId`. Without it, the fields start empty: drafting works
        without a case. Sections start empty. `title` defaults to the template's title, followed
        by the case's title when there is one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftCreate" }
      responses:
        "201":
          description: The new draft, at `version` 1
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /drafts/{draftId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      tags: [drafting]
      operationId: getDraft
      summary: A draft, with its citations' current stored statuses (FR-TRUST-10)
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [drafting]
      operationId: updateDraft
      summary: Save a draft (FR-DRAFT-4)
      description: |
        Replaces the title, fields and sections. `version` must be the draft's current version,
        else 409 (someone saved it in between); a successful save increments it.

        - **Sections** are the template's, by key: an unknown key is a 400, and a missing one is
          saved empty.
        - **Citations.** Every `[[c:<citationId>]]` marker in a section must be a citation that
          `assistDraftSection` returned for this draft, else 400 with `errors[].path` of the
          section. A citation whose marker was removed is no longer part of the draft.
        - **Case.** `caseId` may be changed or set to `null`, with the same rule as
          `createDraft`. Fields are not refilled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftUpdate" }
      responses:
        "200":
          description: The saved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [drafting]
      operationId: deleteDraft
      summary: Delete a draft
      description: Final. The draft's citations stay in the trust store, which is an audit trail (FR-TRUST-12).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /drafts/{draftId}/sections/{sectionKey}/assist:
    post:
      tags: [drafting]
      operationId: assistDraftSection
      summary: Draft one section with AI, with verified citations (FR-DRAFT-3)
      description: |
        Drafts the section from the draft's saved fields and other sections, retrieving within
        the public corpus and only the draft's case (FR-CASE-6). Every citation goes through the
        trust layer; the response carries their stored statuses (FR-TRUST-10). Nothing is saved
        into the draft: the user inserts the text, edits it, and saves with `updateDraft`.

        400 if the section is not in the template or not `assistable`. 403 if AI features are
        disabled for the user (FR-AUTH-3). Providers and the user's own key are applied as for
        `askQuestion` (SEC-11, ADR-0009).
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - name: sectionKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftAssistRequest" }
      responses:
        "200":
          description: The drafted section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAssist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /drafts/{draftId}/export:
    get:
      tags: [drafting]
      operationId: exportDraft
      summary: Export a draft as DOCX or PDF (FR-DRAFT-4)
      description: |
        The saved draft, rendered with its template's headings. Each citation marker becomes a
        footnote with the source, locator and its stored status and last-verified date at the time
        of export (FR-TRUST-5, FR-TRUST-10). Sent with `Content-Disposition: attachment` and
        `X-Content-Type-Options: nosniff`.
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [docx, pdf] }
      responses:
        "200":
          description: The exported file
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, contentMediaType: application/octet-stream }
            application/pdf:
              schema: { type: string, contentMediaType: application/octet-stream }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /lint/rulesets:
    get:
      tags: [linter]
      operationId: listLintRulesets
      summary: The linter's rule sets and each rule's source (FR-LINT-1, FR-LINT-2)
      responses:
        "200":
          description: Rule sets
          content:
            application/json:
              schema: { $ref: "./ai.v1.yaml#/components/schemas/LintRulesetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /lint-reports:
    get:
      tags: [linter]
      operationId: listLintReports
      summary: The user's lint reports, newest first (FR-CASE-4)
      parameters:
        - $ref: "#/components/parameters/LintReportCaseId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LintReportSummary" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [linter]
      operationId: createLintReport
      summary: Lint a document and keep the report (FR-LINT-1, FR-LINT-3, FR-CASE-5)
      description: |
        Lints `text` against the rule set for `documentType` and stores the report with the text
        exactly as sent. The text is never modified: `inputSha256` is the SHA-256 of its UTF-8
        bytes (FR-LINT-3). No model provider is called, so this works when AI features are
        disabled for the user.

        - **Case.** With `caseId`, the report is saved to the case (FR-CASE-5); the case must be
          the caller's and active, else 400 with `errors[].path` of `caseId`.
        - **Draft.** `draftId` only records which draft the text came from. It must be the
          caller's, else 400 with `errors[].path` of `draftId`. The text is always sent, never
          read from the draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LintReportCreate" }
      responses:
        "201":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LintReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /lint-reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/LintReportId"
    get:
      tags: [linter]
      operationId: getLintReport
      summary: A lint report with its text and findings
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LintReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [linter]
      operationId: deleteLintReport
      summary: Delete a lint report
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /citations/{citationId}:
    get:
      tags: [sources]
      operationId: getCitation
      summary: A citation with its current stored verification (FR-TRUST-5, FR-TRUST-10)
      parameters:
        - name: citationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Citation
          content:
            application/json:
              schema: { $ref: "./ai.v1.yaml#/components/schemas/Citation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sources/{sourceId}:
    get:
      tags: [sources]
      operationId: getSource
      summary: A source record with its official public URL (FR-RES-7)
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Source
          content:
            application/json:
              schema: { $ref: "./ai.v1.yaml#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: Every user in the deployment, oldest first (FR-AUTH-3)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userId}:
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      summary: Enable or disable AI features for a user (FR-AUTH-3)
      description: |
        With `aiEnabled: false`, every AI endpoint returns 403 for that user (for example
        `askQuestion`). The change applies from the user's next request.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/providers:
    get:
      tags: [admin]
      operationId: adminListProviders
      summary: The model providers this deployment knows, and which are enabled (FR-AUTH-3, SEC-11)
      description: |
        The provider allow-list. Case data goes only to enabled providers or to a key the
        user supplied (SEC-11). The catalog comes from the deployment's model configuration
        (ADR-0005); this API only switches entries on or off.
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/providers/{providerId}:
    patch:
      tags: [admin]
      operationId: adminUpdateProvider
      summary: Enable or disable a model provider (FR-AUTH-3, SEC-11)
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ProviderId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpdate" }
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: cg_refresh

  headers:
    RefreshCookie:
      description: "`cg_refresh=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`"
      schema: { type: string }

  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseState:
      name: state
      in: query
      description: "`active` (the default) hides archived cases, `archived` shows only them, `all` shows both."
      schema: { type: string, enum: [active, archived, all], default: active }
    ConversationCaseId:
      name: caseId
      in: query
      description: Only the conversations saved to this case (FR-CASE-4). A case that is not the caller's gives an empty page.
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    DocumentCaseId:
      name: caseId
      in: query
      description: Only the documents of this case (FR-CASE-4). A case that is not the caller's gives an empty page.
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DraftCaseId:
      name: caseId
      in: query
      description: Only the drafts saved to this case (FR-CASE-4). A case that is not the caller's gives an empty page.
      schema: { type: string, format: uuid }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LintReportCaseId:
      name: caseId
      in: query
      description: Only the reports saved to this case (FR-CASE-4). A case that is not the caller's gives an empty page.
      schema: { type: string, format: uuid }
    LintReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyProviderId:
      name: providerId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ProviderId" }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationUnread:
      name: unread
      in: query
      description: "`true` lists only the unread notifications; omitted or `false` lists all."
      schema: { type: boolean, default: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    Unauthorized:
      description: Not signed in, or the token is invalid or expired
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }
    Forbidden:
      description: Signed in but not allowed (role, or AI disabled for this user)
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }
    NotFound:
      description: Not found, or not visible to this user (FR-AUTH-4)
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }
    Conflict:
      description: Already exists, or not allowed in the resource's current state
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The upload is larger than the limit (25 MB, FR-DOC-1)
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: The file's type is not one of `DocumentMediaType` (FR-DOC-1)
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }
    Unavailable:
      description: The AI service or a model provider is unavailable
      content:
        application/problem+json:
          schema: { $ref: "./ai.v1.yaml#/components/schemas/Problem" }

  schemas:
    ValidationProblem:
      allOf:
        - $ref: "./ai.v1.yaml#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string, examples: ["email"] }
                  message: { type: string }

    Role:
      description: FR-AUTH-2. Lawyer and Researcher can self-register; Admin is created by an operator.
      type: string
      enum: [lawyer, researcher, admin]

    User:
      type: object
      required: [id, email, name, role, locale, aiEnabled]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        locale: { type: string, enum: [en, ur] }
        aiEnabled:
          description: Set by an admin (FR-AUTH-3).
          type: boolean

    Theme:
      description: "`system` follows the device's light or dark preference."
      type: string
      enum: [light, dark, system]

    UserSettings:
      description: |
        FR-SET-1, FR-SET-2. Users who never chose a theme get `system`; users who never chose a
        model get `defaultModel: null`.
      type: object
      required: [name, locale, theme, defaultModel]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [en, ur] }
        theme: { $ref: "#/components/schemas/Theme" }
        defaultModel:
          description: The user's chosen model, or null for the deployment's default.
          oneOf:
            - $ref: "#/components/schemas/DefaultModel"
            - type: "null"

    UserSettingsUpdate:
      description: At least one field. Unknown fields are rejected with 400.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [en, ur] }
        theme: { $ref: "#/components/schemas/Theme" }
        defaultModel:
          description: A provider and one of its offered models, or null to clear the choice.
          oneOf:
            - $ref: "#/components/schemas/DefaultModel"
            - type: "null"

    DefaultModel:
      description: |
        The model a user's questions are generated with (FR-SET-2). It is used only when the
        provider is still enabled, is a `cloud` provider, and the user has a key for it; then
        apps/api sends that key as `AnswerRequest.credential` (ai.v1, ADR-0009). Otherwise the
        deployment's own configuration answers, as if no model were chosen.
      type: object
      required: [providerId, model]
      additionalProperties: false
      properties:
        providerId: { $ref: "#/components/schemas/ProviderId" }
        model:
          description: One of the provider's `models` from `listModels`.
          type: string
          minLength: 1
          maxLength: 200
          examples: ["gemini-2.0-flash"]

    UserKey:
      description: A saved provider key, without the secret (FR-SET-2, SEC-4). The key itself is never returned.
      type: object
      required: [providerId, last4, createdAt, updatedAt]
      properties:
        providerId: { $ref: "#/components/schemas/ProviderId" }
        last4:
          description: The last four characters of the key, for display as `••••last4`.
          type: string
          minLength: 4
          maxLength: 4
          examples: ["x9Qz"]
        createdAt: { type: string, format: date-time }
        updatedAt:
          description: When the key was last replaced; equals `createdAt` until then.
          type: string
          format: date-time

    UserKeyInput:
      type: object
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          description: The provider's API key. Write-only, stored encrypted, never returned or logged.
          type: string
          minLength: 8
          maxLength: 512
          writeOnly: true

    ProviderModels:
      description: An enabled provider and the models it offers (FR-SET-2).
      type: object
      required: [providerId, name, kind, models, hasKey]
      properties:
        providerId: { $ref: "#/components/schemas/ProviderId" }
        name: { type: string, examples: ["Google Gemini"] }
        kind:
          description: Same as `Provider.kind`. Only `cloud` providers take a key.
          type: string
          enum: [cloud, local]
        models:
          description: Model ids offered for this provider. May be empty.
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        hasKey:
          description: Whether the caller has saved a key for this provider.
          type: boolean

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [en, ur], default: en }
        role:
          description: FR-AUTH-2. Admin cannot be self-registered; `admin` or any other value is a 400.
          type: string
          enum: [lawyer, researcher]
          default: lawyer

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          description: The reset token from the out-of-band message.
          type: string
          minLength: 1
          maxLength: 512
        password: { type: string, minLength: 10, maxLength: 128 }

    Session:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn:
          description: Seconds until the access token expires.
          type: integer
        user: { $ref: "#/components/schemas/User" }

    Party:
      description: |
        One party to the matter (Table 4.29 "Parties"). `side` is the column it belongs to and
        `label` is what the court calls it.
      type: object
      required: [side, name]
      additionalProperties: false
      properties:
        side:
          description: "`claimant`: plaintiff, petitioner, applicant or appellant. `respondent`: defendant, respondent or accused."
          type: string
          enum: [claimant, respondent]
        name: { type: string, minLength: 1, maxLength: 200 }
        label: { type: string, maxLength: 40, examples: ["Petitioner"] }

    # The editable fields of a case, from Deliverable II Table 4.29 (FR-CASE-1). Their bounds are
    # the validation rules (Deliverable II TBD-24). They are written once, as the YAML anchor
    # `caseFields` below, and reused by `CaseInput` and `CaseUpdate`: an `allOf` over a shared
    # schema would lose `required` and `additionalProperties: false` in the generated types.
    # Documents, precedents, drafts and strategy are not fields: they are resources that carry a
    # `caseId` (FR-CASE-4).
    Case:
      description: |
        A case with every field present (`null` or `[]` when empty). `archivedAt` is null while
        the case is active.
      allOf:
        - type: object
          required:
            - title
            - court
            - caseNumber
            - caseType
            - filedOn
            - status
            - nextHearingOn
            - parties
            - judge
            - assignedLawyer
            - relevantLaws
            - summary
          properties: &caseFields
            title: { type: string, minLength: 1, maxLength: 200 }
            court: { type: [string, "null"], maxLength: 120, examples: ["Sindh High Court, Karachi"] }
            caseNumber: { type: [string, "null"], maxLength: 80, examples: ["Cr. Bail No. 1234 of 2026"] }
            caseType:
              description: |
                What the court calls the matter. Free text until the case taxonomy (#164) is
                agreed; its proceeding type and area of law will then be added as separate fields.
              type: [string, "null"]
              maxLength: 80
              examples: ["Cr. Bail"]
            filedOn: { type: [string, "null"], format: date }
            status:
              description: The matter's status before the court. Not archiving, which is `archivedAt`.
              type: [string, "null"]
              maxLength: 80
              examples: ["Reserved for judgment"]
            nextHearingOn: { type: [string, "null"], format: date }
            parties:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/Party" }
            judge: { type: [string, "null"], maxLength: 200 }
            assignedLawyer:
              description: The responsible lawyer, by name. The case's owner is always the signed-in user (FR-AUTH-4).
              type: [string, "null"]
              maxLength: 120
            relevantLaws:
              description: Laws and sections relevant to the case, one per entry.
              type: array
              maxItems: 50
              items: { type: string, minLength: 1, maxLength: 120 }
              examples: [["s.497 CrPC", "s.9(c) CNSA 1997"]]
            summary: { type: [string, "null"], maxLength: 4000 }
        - type: object
          required: [id, createdAt, updatedAt, archivedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            archivedAt: { type: [string, "null"], format: date-time }

    CaseInput:
      description: Only `title` is required; an omitted field is stored empty. Unknown fields are rejected with 400.
      type: object
      required: [title]
      additionalProperties: false
      properties: *caseFields

    CaseUpdate:
      description: |
        Partial: at least one field. `null` clears a nullable field and `[]` clears a list.
        Unknown fields are rejected with 400.
      type: object
      minProperties: 1
      additionalProperties: false
      properties: *caseFields

    DocumentMediaType:
      $ref: "./ai.v1.yaml#/components/schemas/DocumentMediaType"

    DocumentFlag:
      $ref: "./ai.v1.yaml#/components/schemas/DocumentFlag"

    DocumentStatus:
      description: |
        FR-DOC-3. `queued`: stored, waiting to be processed. `processing`: being processed, or
        waiting for an automatic retry (NFR-13). `done`: processed and retrievable in the case's
        research. `flagged`: processed and retrievable, but some parts are uncertain (see
        `flags`); never shown as clean (FR-DOC-4). `failed`: not retrievable, and automatic
        retries are used up or cannot help; the user can retry.
      type: string
      enum: [queued, processing, done, flagged, failed]

    Document:
      description: |
        A file uploaded to one of the caller's cases. Every field is present (`null` or `[]`
        when empty).
      type: object
      required:
        [id, caseId, filename, mediaType, sizeBytes, status, flags, error, pages, createdAt, updatedAt, processedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        filename:
          description: The original filename, without any directory.
          type: string
          minLength: 1
          maxLength: 255
          examples: ["FIR 112-2026.pdf"]
        mediaType: { $ref: "#/components/schemas/DocumentMediaType" }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        flags:
          description: |
            What is uncertain in the chunks that are retrievable now (FR-DOC-4): the flags of the
            last finished attempt. Non-empty when `status` is `flagged`, and while a retry of a
            flagged document is `queued` or `processing`; empty otherwise.
          type: array
          items: { $ref: "#/components/schemas/DocumentFlag" }
        error:
          description: Why processing failed, for the user. Set only when `status` is `failed`.
          type: [string, "null"]
          maxLength: 500
        pages:
          description: Page count once known (a PNG or JPEG is one page; a TIFF has one per frame).
          type: [integer, "null"]
          minimum: 0
        createdAt: { type: string, format: date-time }
        updatedAt:
          description: Last status change.
          type: string
          format: date-time
        processedAt:
          description: When the latest attempt finished (`done`, `flagged` or `failed`); null before.
          type: [string, "null"]
          format: date-time

    DocumentUpload:
      description: The `multipart/form-data` body of `uploadDocument`. Other parts are rejected with 400.
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          description: The file's bytes, at most 25 MB (FR-DOC-1). The part needs a `filename`.
          type: string
          contentMediaType: application/octet-stream
          maxLength: 26214400

    PrecedentSearch:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        filters: { $ref: "./ai.v1.yaml#/components/schemas/PrecedentFilters" }
        includeGraphDerived: { type: boolean, default: true }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }

    PrecedentSearchResult:
      $ref: "./ai.v1.yaml#/components/schemas/PrecedentSearchResult"

    DraftSummary:
      type: object
      required: [id, templateId, title, caseId, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { $ref: "./ai.v1.yaml#/components/schemas/DraftTemplateId" }
        title: { type: string }
        caseId: { type: [string, "null"], format: uuid }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }

    Draft:
      description: |
        Every field is present. `fields` has every key of the template (`null` when empty) and
        `sections` every section of the template, in order (`""` when empty).
      type: object
      required: [id, templateId, templateVersion, title, caseId, fields, sections, citations, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { $ref: "./ai.v1.yaml#/components/schemas/DraftTemplateId" }
        templateVersion:
          description: The template version the draft was created from.
          type: string
        title: { type: string, minLength: 1, maxLength: 200 }
        caseId: { type: [string, "null"], format: uuid }
        fields:
          type: object
          additionalProperties: { type: [string, "null"], maxLength: 4000 }
        sections:
          type: array
          items: { $ref: "./ai.v1.yaml#/components/schemas/DraftSectionBody" }
        citations:
          description: The citations whose markers are in the sections, with their current stored verification (FR-TRUST-10).
          type: array
          items: { $ref: "./ai.v1.yaml#/components/schemas/Citation" }
        version:
          description: Increments on every save; send it back with `updateDraft`.
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DraftCreate:
      type: object
      required: [templateId]
      additionalProperties: false
      properties:
        templateId: { $ref: "./ai.v1.yaml#/components/schemas/DraftTemplateId" }
        title: { type: string, minLength: 1, maxLength: 200 }
        caseId: { type: [string, "null"], format: uuid }

    DraftUpdate:
      type: object
      required: [version, title, caseId, fields, sections]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        caseId: { type: [string, "null"], format: uuid }
        fields:
          description: Values by template field key. An unknown key is a 400.
          type: object
          additionalProperties: { type: [string, "null"], maxLength: 4000 }
        sections:
          type: array
          maxItems: 30
          items: { $ref: "./ai.v1.yaml#/components/schemas/DraftSectionBody" }

    DraftAssistRequest:
      type: object
      additionalProperties: false
      properties:
        instruction:
          description: Optional guidance for this section, e.g. "stress that the accused is a first offender".
          type: string
          maxLength: 2000

    DraftAssist:
      type: object
      required: [sectionKey, text, citations]
      properties:
        sectionKey: { type: string }
        text:
          description: Citation markers appear as `[[c:<citationId>]]`.
          type: string
        citations:
          type: array
          items: { $ref: "./ai.v1.yaml#/components/schemas/Citation" }

    LintReportCreate:
      type: object
      required: [documentType, text]
      additionalProperties: false
      properties:
        documentType: { $ref: "./ai.v1.yaml#/components/schemas/LintDocumentType" }
        text: { type: string, minLength: 1, maxLength: 200000 }
        title:
          description: Defaults to the document type and date.
          type: string
          minLength: 1
          maxLength: 200
        caseId: { type: [string, "null"], format: uuid }
        draftId: { type: [string, "null"], format: uuid }

    LintReportSummary:
      type: object
      required: [id, documentType, title, caseId, draftId, findingCounts, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "./ai.v1.yaml#/components/schemas/LintDocumentType" }
        title: { type: string }
        caseId: { type: [string, "null"], format: uuid }
        draftId: { type: [string, "null"], format: uuid }
        findingCounts:
          type: object
          required: [error, warning, info]
          properties:
            error: { type: integer, minimum: 0 }
            warning: { type: integer, minimum: 0 }
            info: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }

    LintReport:
      description: Every field is present (`null` when empty).
      type: object
      required: [id, documentType, title, caseId, draftId, text, inputSha256, rulesetId, rulesetVersion, findings, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "./ai.v1.yaml#/components/schemas/LintDocumentType" }
        title: { type: string }
        caseId: { type: [string, "null"], format: uuid }
        draftId: { type: [string, "null"], format: uuid }
        text:
          description: The text exactly as linted, byte for byte (FR-LINT-3).
          type: string
        inputSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        rulesetId: { type: string }
        rulesetVersion: { type: string }
        findings:
          type: array
          items: { $ref: "./ai.v1.yaml#/components/schemas/LintFinding" }
        createdAt: { type: string, format: date-time }

    NotificationKind:
      description: |
        What happened. A document's processing finished `done`, finished `flagged` (uncertain
        parts, FR-DOC-4) or `failed` after its retries (NFR-13). Created once per attempt's final
        outcome, never for an automatic retry in between. New kinds (other long jobs) are
        additive, so a client shows a generic text for a kind it does not know.
      type: string
      enum: [document_done, document_flagged, document_failed]

    Notification:
      description: Every field is present (`null` when empty).
      type: object
      required: [id, kind, documentId, caseId, filename, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        documentId:
          description: The document it is about; null once that document is deleted.
          type: [string, "null"]
          format: uuid
        caseId:
          description: The document's case, for the link to the case dashboard.
          type: string
          format: uuid
        filename:
          description: The document's filename when the notification was made, kept after a delete.
          type: string
          minLength: 1
          maxLength: 255
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    ConversationUpdate:
      description: Save a conversation to a case, or detach it with `null` (FR-CASE-5).
      type: object
      required: [caseId]
      additionalProperties: false
      properties:
        caseId: { type: [string, "null"], format: uuid }

    ConversationSummary:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        caseId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/Message" }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        language:
          description: Omit to auto-detect.
          allOf: [{ $ref: "./ai.v1.yaml#/components/schemas/Language" }]
        lawAsOf:
          description: '"Law as of date D" (FR-RES-11).'
          type: string
          format: date

    Message:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        text:
          description: For assistant messages, citation markers appear as `[[c:<citationId>]]`.
          type: string
        language: { $ref: "./ai.v1.yaml#/components/schemas/Language" }
        answerable:
          description: Assistant messages only (FR-RES-9).
          type: boolean
        citations:
          type: array
          items: { $ref: "./ai.v1.yaml#/components/schemas/Citation" }
        asOfNote:
          description: |
            Assistant messages only, and only when the question gave `lawAsOf` (FR-RES-11): what
            the date changed (later judgments excluded; statutes are the current text).
          type: string
        createdAt: { type: string, format: date-time }

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [createdAt]
          properties:
            createdAt: { type: string, format: date-time }

    AdminUserUpdate:
      type: object
      required: [aiEnabled]
      additionalProperties: false
      properties:
        aiEnabled: { type: boolean }

    ProviderId:
      $ref: "./ai.v1.yaml#/components/schemas/ProviderId"

    Provider:
      type: object
      required: [id, name, kind, enabled]
      properties:
        id: { $ref: "#/components/schemas/ProviderId" }
        name: { type: string, examples: ["Google Gemini"] }
        kind:
          description: "`local` keeps data on the machine (for example Ollama); `cloud` sends it to a third party (SEC-11)."
          type: string
          enum: [cloud, local]
        enabled: { type: boolean }

    ProviderUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
